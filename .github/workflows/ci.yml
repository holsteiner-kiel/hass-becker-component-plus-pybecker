name: CI

on:
  push:
    branches:
      - main
      - "hardening-*"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements_test.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests
        run: pytest -c tests/pytest.ini tests
